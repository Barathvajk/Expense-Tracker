<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div>
      <h2>💰 Expense Tracker</h2>
      <span id="welcomeMsg" class="welcome-msg"></span>
    </div>
    <div class="header-actions">
      <button onclick="exportCSV()" class="export-btn">📥 Export CSV</button>
      <button onclick="logout()"    class="logout-btn">Logout</button>
    </div>
  </div>

  <!-- Budget Bar -->
  <div class="budget-section">
    <div class="budget-header">
      <span>Monthly Budget</span>
      <div class="budget-controls">
        <input id="budgetInput" type="number" placeholder="Set budget..." class="budget-input"/>
        <button onclick="saveBudget()" class="save-budget-btn">Save</button>
      </div>
    </div>
    <div class="budget-bar-wrap">
      <div id="budgetBar" class="budget-bar"></div>
    </div>
    <div class="budget-labels">
      <span id="budgetSpent">Spent: ₹0</span>
      <span id="budgetRemaining">Remaining: ₹0</span>
    </div>
  </div>

  <!-- Expense Form -->
  <div class="form-section">
    <h3 id="formTitle">Add Expense</h3>
    <div class="form-group">
      <input id="amount"   type="number" placeholder="Amount (₹)" min="0.01" step="0.01"/>
     <select id="category">
         <option value="">Select Category</option>
         <option value="Food & Dining">🍽 Food & Dining</option>
         <option value="Transport">🚗 Transport</option>
         <option value="Shopping">🛍 Shopping</option>
         <option value="Rent & Housing">🏠 Rent & Housing</option>
         <option value="Health">💊 Health</option>
         <option value="Entertainment">🎬 Entertainment</option>
         <option value="Utilities">⚡ Utilities</option>
         <option value="Education">📚 Education</option>
         <option value="Travel">✈ Travel</option>
         <option value="Fitness">💪 Fitness</option>
         <option value="Groceries">🛒 Groceries</option>
         <option value="Subscriptions">📱 Subscriptions</option>
         <option value="Personal Care">🪥 Personal Care</option>
         <option value="Investments">📈 Investments</option>
         <option value="Gifts & Charity">🎁 Gifts & Charity</option>
         <option value="Other">📦 Other</option>
</select>
      <input id="note" placeholder="Description"/>
      <input id="date" type="date"/>
      <div class="form-btns">
        <button id="addBtn">Add Expense</button>
        <button id="cancelBtn" class="cancel-btn hidden" onclick="cancelEdit()">Cancel</button>
      </div>
    </div>
    <div id="formError" class="form-error hidden"></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input  type="text"   id="searchInput"     placeholder="🔍 Search description..."/>
    <select id="filterCategory">
       <option value="all">All Categories</option>
       <option value="Food & Dining">🍽 Food & Dining</option>
       <option value="Transport">🚗 Transport</option>
       <option value="Shopping">🛍 Shopping</option>
       <option value="Rent & Housing">🏠 Rent & Housing</option>
       <option value="Health">💊 Health</option>
       <option value="Entertainment">🎬 Entertainment</option>
       <option value="Utilities">⚡ Utilities</option>
       <option value="Education">📚 Education</option>
       <option value="Travel">✈ Travel</option>
       <option value="Fitness">💪 Fitness</option>
       <option value="Groceries">🛒 Groceries</option>
       <option value="Subscriptions">📱 Subscriptions</option>
       <option value="Personal Care">🪥 Personal Care</option>
       <option value="Investments">📈 Investments</option>
       <option value="Gifts & Charity">🎁 Gifts & Charity</option>
       <option value="Other">📦 Other</option>
    </select>
    <input type="month" id="monthFilter"/>
    <button onclick="clearFilters()" class="clear-btn">✕ Clear</button>
  </div>

  <!-- Summary Cards -->
  <div class="summary-cards">
    <div class="card"><div class="card-label">This Month</div>    <div id="cardMonthTotal"    class="card-value">₹0</div></div>
    <div class="card"><div class="card-label">Filtered Total</div><div id="cardFilteredTotal" class="card-value">₹0</div></div>
    <div class="card"><div class="card-label">Total Expenses</div><div id="cardCount"          class="card-value">0</div></div>
    <div class="card"><div class="card-label">Avg per Expense</div><div id="cardAvg"           class="card-value">₹0</div></div>
  </div>

  <!-- Charts -->
  <div class="charts-row">
    <div class="chart-box"><h3>By Category</h3>   <canvas id="expenseChart"></canvas></div>
    <div class="chart-box"><h3>Monthly Trend</h3> <canvas id="monthlyChart"></canvas></div>
  </div>

  <!-- Analytics -->
  <div class="analytics-section">
    <h3>Category Breakdown</h3>
    <div id="analyticsData" class="analytics-grid"></div>
  </div>

  <!-- Expense List -->
  <div class="list-header">
    <h3>Expenses</h3>
    <span id="listCount" class="list-count"></span>
  </div>
  <div id="expensesList" class="expense-list"></div>

  <!-- Pagination -->
  <div class="pagination">
    <button id="prevPage">← Prev</button>
    <span   id="pageNumber">Page 1</span>
    <button id="nextPage">Next →</button>
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="../js/api.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
