<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Expense Tracker</title>
  <link rel="stylesheet" href="../css/auth.css"/>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">💰</div>
    <h2>Create Account</h2>
    <p class="auth-sub">Start tracking your expenses today</p>

    <div id="errorMsg"   class="error-msg hidden"></div>
    <div id="successMsg" class="success-msg hidden"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input id="name" type="text" placeholder="John Doe" autocomplete="name"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password <span class="hint">(min 6 characters)</span></label>
      <div class="input-wrap">
        <input id="password" type="password" placeholder="••••••••" autocomplete="new-password"/>
        <span class="toggle-pw" onclick="togglePassword()">👁</span>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input id="confirmPassword" type="password" placeholder="••••••••"/>
    </div>

    <button id="registerBtn" onclick="register()">Create Account</button>
    <p class="auth-switch">Already have an account? <a href="login.html">Sign In</a></p>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
